# Alaska has either 1 or 2 voter files, which include voting history columns.
# In the 1 file case, it includes only the active voters.
# The 2nd file, which is only included sometimes, contains inactive voters.

state: alaska
abbreviation: ak

source: boe
file_class: voter_file

file_type: csv
delimiter: ','
has_headers: true

format:
  separate_hist: false
  segmented_files: false

# I don't think we can do this check since the number is variable
# expected_number_of_files: 1 or 2

voter_id: ASCENSION
county_identifier: None   # no county data in Alaska
primary_locale_identifier: STATE_HOUSE_DISTRICT
numeric_primary_locale: true
precinct_identifier: PRECINCT

# no birth dates in Alaska - this is a dummy column
birthday_identifier: BIRTH_DATE

registration_date_identifier: REG_DATE

date_format: '%m/%d/%Y'

voter_status: STATUS
voter_status_active:
  - active
voter_status_inactive:
  - inactive

# Reasons only exist for inactive voters
reason_code: CC

party_identifier: PARTY

democratic_party: D
republican_party: R
no_party_affiliation: U
libertarian: L
green: G

# Voting History
absentee_ballot_code: "'a'"
provisional_ballot_code: "'q'"
# This is not actually used in the code,
# but nice to list the options here just for visibility
valid_voting_methods: [
  'p', # in person at polls
  'e', # early ballot
  'a', # absentee ballot
  'q', # questioned ballot (equivalent to provisional)
  'm', # voted by mail
]

demographic_fields_available:
  - gender
  - party
  - status

# Used to define the compound change_type "name" changes.
name_fields:
  - LAST_NAME
  - FIRST_NAME
  - MIDDLE_NAME
  - SUFFIX_NAME

# This is used for matching duplicates in Jiamin's
# create_dupes_custom_population() vote-cli function.
standard_name_fields:
  - LAST_NAME
  - FIRST_NAME
  - MIDDLE_NAME

# Used to define the compound change_type "address" changes.
address_fields:
  - RESIDENCE_ADDRESS
  - RESIDENCE_CITY
  - RESIDENCE_ZIP
  - MAILING_ADDRESS1
  - MAILING_ADDRESS2
  - MAILING_ADDRESS3
  - MAILING_CITY
  - MAILING_STATE
  - MAILING_ZIP
  - MAILING_COUNTRY

street_address_fields:
  - RESIDENCE ADDRESS
  - RESIDENCE CITY

columns:
  UN: text
  PARTY: text
  STATE_HOUSE_DISTRICT: text  # split out from "D/P" column
  PRECINCT: text  # split out from "D/P" column
  LAST_NAME: text
  FIRST_NAME: text
  MIDDLE_NAME: text
  SUFFIX_NAME: text
  ASCENSION: text
  REG_DATE: date
  CONDITION_DATE: date  # only present in inactive file
  ORG_REG_DATE: date
  DIST_DATE: date
  RESIDENCE_ADDRESS: text
  RESIDENCE_CITY: text
  RESIDENCE_ZIP: text
  MAILING_ADDRESS1: text
  MAILING_ADDRESS2: text
  MAILING_ADDRESS3: text
  MAILING_CITY: text
  MAILING_STATE: text
  MAILING_ZIP: text
  MAILING_COUNTRY: text
  GENDER: text
  CC: text          # "condition (reason) code", only present in inactive file
  STATUS: text      # column VoteShield adds, based on which file a voter was in
  BIRTH_DATE: text  # dummy column VoteShield adds

ordered_columns:
  - UN
  - PARTY
  - STATE_HOUSE_DISTRICT
  - PRECINCT
  - LAST_NAME
  - FIRST_NAME
  - MIDDLE_NAME
  - SUFFIX_NAME
  - ASCENSION
  - REG_DATE
  - CONDITION_DATE
  - ORG_REG_DATE
  - DIST_DATE
  - RESIDENCE_ADDRESS
  - RESIDENCE_CITY
  - RESIDENCE_ZIP
  - MAILING_ADDRESS1
  - MAILING_ADDRESS2
  - MAILING_ADDRESS3
  - MAILING_CITY
  - MAILING_STATE
  - MAILING_ZIP
  - MAILING_COUNTRY
  - GENDER
  - CC
  - STATUS
  - BIRTH_DATE

generated_columns:
  all_history: text[]
  sparse_history: int[]
  votetype_history: text[]

ordered_generated_columns:
  - all_history
  - sparse_history
  - votetype_history

# Some files have slight column name variations.
column_aliases:
    'D/P': DP
    'ASCENSION #': ASCENSION

  Mapping Value: text
  FIRST_NAME: text
  MIDDLE_NAME: text
  LAST_NAME: text
  SUFFIX: text
  RESIDENTIAL_ADDRESS: text
  HOUSE_NUM: text
  STREET_NAME: text
  STREET_TYPE: text
  PRE-DIRECTION: text
  POST-DIRECTION: text
  RES_CITY: text
  RES_STATE: text
  RES_ZIP_CODE: text
  RES_COUNTY: text
  PRECINCT_CODE: text
  PRECINCT_NAME: text
  MAILING_ADDRESS: text
  MAIL_CITY: text
  MAIL_STATE: text
  MAIL_ZIP_CODE: text
  EFFECTIVE_REGN_DATE: date
  STATUS: text

# Mississippi voter file.
# The voter ID column is labeled "Mapping Value" in the file.
# No birth date or party data in the voter file.
# Vote history is a separate file with one row per voter and election.
# The US and MS columns only ever hold the literal values "US" and "MS".


###############################
# State name and abbreviation
state: mississippi
abbreviation: ms

# Not used but good to have a record of
file_type: .csv
delimiter: ','
source: boe
file_class: voter_file

format:
  separate_hist: true
  segmented_files: true

has_headers: true
fixed_width: false

# Used in "file_check" during raw file processing
expected_number_of_files: 2


###############################
# Standard column names

voter_id: Mapping Value

county_identifier: RES_COUNTY
primary_locale_identifier: RES_COUNTY
numeric_primary_locale: false

precinct_identifier: PRECINCT_CODE

# No birth date in the file, so this is a dummy column added during preprocessing
birthday_identifier: birthday_identifier

registration_date_identifier: EFFECTIVE_REGN_DATE


###############################
# Todo: check across files
date_format: '%m/%d/%Y'


###############################
# The column that has voter status.
voter_status: STATUS

voter_status_active:
  - Active

voter_status_inactive:
  - Inactive


###############################
# No party data in the file, so this is a dummy column added during preprocessing
party_identifier: party_identifier


###############################
# A list of which demographics columns are available in this state.
demographic_fields_available:
  - status


###############################
# Used to define the compound change_type "name" changes.
name_fields:
  - LAST_NAME
  - FIRST_NAME
  - MIDDLE_NAME
  - SUFFIX

standard_name_fields:
  - LAST_NAME
  - FIRST_NAME
  - MIDDLE_NAME

# Used to define the compound change_type "address" changes.
address_fields:
  - RESIDENTIAL_ADDRESS
  - HOUSE_NUM
  - PRE-DIRECTION
  - STREET_NAME
  - STREET_TYPE
  - POST-DIRECTION
  - RES_CITY
  - RES_STATE
  - RES_ZIP_CODE
  - MAILING_ADDRESS
  - MAIL_CITY
  - MAIL_STATE
  - MAIL_ZIP_CODE

street_address_fields:
  - HOUSE_NUM
  - PRE-DIRECTION
  - STREET_NAME
  - STREET_TYPE
  - POST-DIRECTION
  - RES_CITY


###############################
# Columns in the voter file, plus the dummy birthday and party columns
